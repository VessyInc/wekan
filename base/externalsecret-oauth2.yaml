apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wekan-oauth2
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: wekan-central-kv
  target:
    name: wekan-oauth2
    creationPolicy: Owner
  data:
    - secretKey: OAUTH2_SECRET
      remoteRef:
        key: wekan-oauth2-client-secret
