apiVersion: apps/v1
kind: Deployment
metadata:
  name: wekan
spec:
  # Pinned at 1 on purpose. Cosmos DB for MongoDB vCore exposes no oplog, so
  # MONGO_OPLOG_URL stays empty and Meteor falls back to poll-and-diff, which
  # does not keep multiple instances in sync. Scaling out needs oplog support
  # plus sticky sessions for the DDP/sockjs connection.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wekan
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wekan
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wekan
          image: ghcr.io/wekan/wekan:v12.63
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: wekan-env
            - secretRef:
                name: wekan-mongodb
            - secretRef:
                name: wekan-oauth2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: data
          emptyDir: {}
