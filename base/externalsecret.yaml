apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wekan-mongodb
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: wekan-central-kv
  target:
    name: wekan-mongodb
    creationPolicy: Owner
  data:
    - secretKey: MONGO_URL
      remoteRef:
        key: wekan-mongo-connection-string
