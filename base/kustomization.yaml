apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wekan

resources:
  - serviceaccount.yaml
  - secretstore.yaml
  - externalsecret.yaml
  - deployment.yaml
  - service.yaml

labels:
  - includeSelectors: false
    includeTemplates: false
    pairs:
      app.kubernetes.io/part-of: "wekan"
      app.kubernetes.io/managed-by: "ArgoCD"
