apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wekan

resources:
  - ../../base
  - configmap.yaml
  - ingress.yaml

patches:
  - path: patches/resource-limits.yaml

labels:
  - includeSelectors: false
    includeTemplates: false
    pairs:
      app.kubernetes.io/environment: "production"
