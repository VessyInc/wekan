apiVersion: v1
kind: ConfigMap
metadata:
  name: wekan-env
data:
  ROOT_URL: "https://wekan.vessyinc.com"
  PORT: "8080"
  WRITABLE_PATH: "/data"
  WITH_API: "true"
  BROWSER_POLICY_ENABLED: "true"
  TRUSTED_URL: "https://wekan.vessyinc.com"
  OAUTH2_ENABLED: "true"
  OAUTH2_LOGIN_STYLE: "redirect"
  OAUTH2_CLIENT_ID: "ba70f6a5-beca-460b-8a9c-ae01bf914578"
  OAUTH2_SERVER_URL: "https://login.microsoftonline.com/9cdec346-9087-4758-a5a5-2144a3ed72d4"
  OAUTH2_AUTH_ENDPOINT: "/oauth2/v2.0/authorize"
  OAUTH2_TOKEN_ENDPOINT: "/oauth2/v2.0/token"
  OAUTH2_USERINFO_ENDPOINT: "https://graph.microsoft.com/oidc/userinfo"
  OAUTH2_REQUEST_PERMISSIONS: "openid profile email"
  OAUTH2_ID_MAP: "email"
  OAUTH2_USERNAME_MAP: "email"
  OAUTH2_FULLNAME_MAP: "name"
  OAUTH2_EMAIL_MAP: "email"
  OAUTH2_LOGOUT_ENDPOINT: "/oauth2/v2.0/logout"